<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Video Viewer</title>

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#111;

    display:flex;
    justify-content:center;
    align-items:center;

}

video{

    width:100%;
    height:100%;

}

</style>

</head>

<body>

<video
    id="viewer"
    controls
    autoplay>

</video>

<script>

const params =
    new URLSearchParams(
        location.search
    );

const path =
    params.get("path") || "";

const file =
    params.get("file") || "";

document
    .getElementById("viewer")
    .src =
        `${path}/${file}`;

</script>

</body>
</html>
